<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#111;font-family:Poppins,Arial,sans-serif;color:#fff}
.card{position:absolute;left:80px;right:80px;padding:40px 50px;border-radius:30px;background:#fff;color:#111;
  font-size:72px;font-weight:900;border:6px solid #000;box-shadow:12px 12px 0 #000;opacity:0}
#cap{position:absolute;top:960px;left:40px;right:40px;text-align:center;font-size:84px;font-weight:900;line-height:1.1;
  -webkit-text-stroke:14px #000;paint-order:stroke fill;z-index:2}
#cap .now{color:#ffd23f} #cap .later{opacity:.35}
.sam{position:absolute;left:140px;bottom:-40px;width:800px;display:none}
</style></head><body>

<!-- YOUR SCENE. Any element with data-at="@word" pops in when that word is spoken.
     data-out="@word" hides it again. Same word twice? "@pipeline#2" = the 2nd time. -->
<div class=card data-at="@shoot" data-out="@whole" style="top:150px;transform:rotate(-3deg)">🎥 shoot ✗</div>
<div class=card data-at="@edit" data-out="@whole" style="top:420px;transform:rotate(2deg)">✂️ edit ✗</div>
<div class=card data-at="@code" data-out="@want" style="top:300px;background:#2fcf6a;font-size:110px;text-align:center">100% CODE</div>
<div class=card data-at="@pipeline#2" style="top:300px;background:#ffd23f;font-size:100px;text-align:center">comment<br>PIPELINE</div>

<div id=cap></div>
<img class=sam id=closed src="mascot-closed.png"><img class=sam id=open src="mascot-open.png">
<script src="data.js"></script>
<script>
const W = DATA.words, FPS = 30;
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
function cue(at) {                       // "@word" or "@word#2" -> the second when it's spoken
  const [w, n] = at.slice(1).split('#');
  const hit = W.filter(x => norm(x[2]) === norm(w))[(n || 1) - 1];
  if (!hit) throw new Error('cue word not in script.txt: ' + at);
  return hit[0];
}
const ITEMS = [...document.querySelectorAll('[data-at]')].map(e => ({
  e, at: cue(e.dataset.at), out: e.dataset.out ? cue(e.dataset.out) : 1e9, base: e.style.transform || '' }));
const CHUNKS = [];                       // captions: 3 words at a time
for (let i = 0; i < W.length; i += 3) CHUNKS.push(W.slice(i, i + 3));

function setT(t) {                       // draw the frame at time t (seconds)
  for (const it of ITEMS) {
    const p = Math.min(1, Math.max(0, (t - it.at) / .25)), back = 1 + 2.7 * Math.pow(p - 1, 3) + 1.7 * Math.pow(p - 1, 2);
    it.e.style.opacity = t >= it.out ? 0 : Math.min(1, p * 4);
    it.e.style.transform = it.base + ` scale(${t < it.at ? .5 : .5 + .5 * back})`;
  }
  const c = CHUNKS.find((c, i) => t >= c[0][0] - .05 && t < (CHUNKS[i + 1] ? CHUNKS[i + 1][0][0] : c[c.length - 1][1] + .5));
  document.getElementById('cap').innerHTML = c ? c.map(w =>
    `<span class="${t < w[0] ? 'later' : t < w[1] ? 'now' : ''}">${w[2]}</span>`).join(' ') : '';
  const open = DATA.mouth[Math.floor(t * FPS)] === 'o';
  document.getElementById('open').style.display = open ? 'block' : 'none';
  document.getElementById('closed').style.display = open ? 'none' : 'block';
}
window.setT = setT; window.DURATION = DATA.duration; setT(0);
</script></body></html>
